name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests with coverage
        run: pytest --cov=po_delay --cov-report=term-missing --cov-report=xml

      - name: End-to-end pipeline smoke test
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from po_delay.data_generation import GeneratorParams, generate
          from po_delay.features import build_features
          from po_delay.validation import assert_no_time_leakage, time_based_split
          from po_delay.models import build_logistic_pipeline, evaluate

          df = generate(GeneratorParams(n_orders=3000, n_suppliers=30, seed=1))
          X, y = build_features(df)
          split = time_based_split(df)
          assert_no_time_leakage(df, split)
          model = build_logistic_pipeline(max_iter=200)
          model.fit(X.iloc[split.train_idx], y.iloc[split.train_idx])
          proba = model.predict_proba(X.iloc[split.test_idx])[:, 1]
          metrics = evaluate(y.iloc[split.test_idx], proba)
          print('Smoke test metrics:', metrics)
          assert 0.0 <= metrics['roc_auc'] <= 1.0
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
